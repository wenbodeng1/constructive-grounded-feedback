<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Constructive Grounded Feedback: check, suggest, revise">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3EE"/>
      <stop offset="0.5" stop-color="#E6EEFF"/>
      <stop offset="1" stop-color="#DDF7EA"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8DB6FF"/>
      <stop offset="1" stop-color="#5E8CF0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#5A5F8A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="340" rx="34" fill="url(#bg)"/>

  <!-- confetti -->
  <g opacity="0.9">
    <circle cx="70" cy="58" r="9" fill="#FFB3C8"/>
    <circle cx="1205" cy="62" r="11" fill="#FFD66B"/>
    <circle cx="1232" cy="292" r="8" fill="#8FD9B6"/>
    <circle cx="455" cy="300" r="7" fill="#A9C4FF"/>
    <circle cx="610" cy="40" r="6" fill="#FFB3C8"/>
    <circle cx="300" cy="36" r="5" fill="#8FD9B6"/>
    <path d="M1090 40 l6 14 l15 2 l-11 10 l3 15 l-13 -8 l-13 8 l3 -15 l-11 -10 l15 -2z" fill="#FFD66B"/>
    <path d="M42 262 l5 11 l12 2 l-9 8 l2 12 l-10 -6 l-10 6 l2 -12 l-9 -8 l12 -2z" fill="#FF9FBC"/>
    <path d="M1236 190 l4 9 l10 1 l-7 6 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -6 l10 -1z" fill="#A9C4FF"/>
  </g>

  <!-- robot mascot -->
  <g transform="translate(78,52)" filter="url(#soft)">
    <line x1="112" y1="18" x2="112" y2="44" stroke="#5E8CF0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="112" cy="14" r="12" fill="#FF8FB1"/>
    <rect x="22" y="42" width="180" height="150" rx="44" fill="url(#head)"/>
    <rect x="44" y="66" width="136" height="88" rx="30" fill="#1F2A4D"/>
    <ellipse cx="86" cy="106" rx="13" ry="17" fill="#7FF5E4"/>
    <ellipse cx="138" cy="106" rx="13" ry="17" fill="#7FF5E4"/>
    <circle cx="90" cy="100" r="4" fill="#FFFFFF"/>
    <circle cx="142" cy="100" r="4" fill="#FFFFFF"/>
    <path d="M98 132 q14 12 28 0" stroke="#7FF5E4" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="54" cy="160" rx="14" ry="8" fill="#FFB3C8" opacity="0.85"/>
    <ellipse cx="170" cy="160" rx="14" ry="8" fill="#FFB3C8" opacity="0.85"/>
    <rect x="6" y="96" width="20" height="44" rx="10" fill="#5E8CF0"/>
    <rect x="198" y="96" width="20" height="44" rx="10" fill="#5E8CF0"/>
  </g>

  <!-- checklist card held next to the robot -->
  <g transform="translate(300,96) rotate(6)" filter="url(#soft)">
    <rect x="0" y="0" width="128" height="164" rx="18" fill="#FFFFFF"/>
    <rect x="44" y="-10" width="40" height="18" rx="9" fill="#FFD66B"/>
    <g transform="translate(18,32)">
      <circle cx="10" cy="8" r="10" fill="#C9F2DD"/>
      <path d="M4 8 l5 5 l9 -10" stroke="#25A56A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="28" y="4" width="62" height="8" rx="4" fill="#DDE3F3"/>
    </g>
    <g transform="translate(18,70)">
      <circle cx="10" cy="8" r="10" fill="#FFD9E2"/>
      <path d="M5 3 l10 10 M15 3 l-10 10" stroke="#E0476B" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="28" y="4" width="62" height="8" rx="4" fill="#DDE3F3"/>
    </g>
    <g transform="translate(18,108)">
      <circle cx="10" cy="8" r="10" fill="#FFF0B8"/>
      <circle cx="10" cy="6" r="5" fill="#F5B700"/>
      <rect x="7" y="11" width="6" height="5" rx="1.5" fill="#B88A00"/>
      <rect x="28" y="4" width="62" height="8" rx="4" fill="#DDE3F3"/>
    </g>
  </g>

  <!-- title -->
  <text x="476" y="128" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#2B2D42" textLength="740" lengthAdjust="spacingAndGlyphs">Constructive Grounded Feedback</text>
  <text x="478" y="172" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#4A4E69" textLength="560" lengthAdjust="spacingAndGlyphs">for small LM agents on constraint-rich long tasks</text>

  <!-- check -> suggest -> revise pills -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="478" y="208" width="150" height="48" rx="24" fill="#FFD9E2"/>
    <text x="553" y="240" text-anchor="middle" fill="#B5234B">CHECK</text>
    <path d="M642 232 h34 m-12 -10 l12 10 l-12 10" stroke="#9AA0BF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="690" y="208" width="170" height="48" rx="24" fill="#FFF0B8"/>
    <text x="775" y="240" text-anchor="middle" fill="#8A6500">SUGGEST</text>
    <path d="M874 232 h34 m-12 -10 l12 10 l-12 10" stroke="#9AA0BF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="922" y="208" width="160" height="48" rx="24" fill="#D6E6FF"/>
    <text x="1002" y="240" text-anchor="middle" fill="#2457C5">REVISE</text>
  </g>
  <text x="478" y="296" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6B6F8A">training-free · grounded in the environment's own data · no gold plans, no oracles</text>
</svg>
